<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/icons/logo.svg">
  <meta name="description" content="Вход в УниМаркет.">
  <title>Вход — УниМаркет</title>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/auth.css">
  <script type="module" src="../../assets/js/login.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__vnutri container">
      <a class="brand" href="../../index.html" aria-label="УниМаркет — главная">
        <img src="../../assets/icons/logo.svg" width="40" height="40" alt="">
        <span>УниМаркет</span>
      </a>
    </div>
  </header>
  <main class="auth container">
    <section class="auth__screen" aria-labelledby="title">
      <h1 id="title">С возвращением</h1>
      <form class="auth__form form--bez-zvezd" method="post">
        <div class="field">
          <label for="login">Логин</label>
          <input id="login" name="login" autocomplete="username" maxlength="32" required>
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <div class="field__password">
            <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
          </div>
        </div>
        <button class="button button--main" type="submit">Войти</button>
        <p class="form__status" role="alert" hidden></p>
        <div class="auth__links">
          <a href="register.html">Зарегистрироваться</a>
          <a href="recovery.html">Восстановить доступ</a>
        </div>
      </form>
    </section>
    <nav class="auth__nav" aria-label="Полезные ссылки">
      <a href="../../index.html#faq-title">Помощь и правила</a>
      <a href="../../index.html">На главную</a>
    </nav>
    <noscript><p class="auth__nav">Для входа включи JavaScript.</p></noscript>
  </main>
</body>
</html>
