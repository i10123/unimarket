<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог — УниМаркет</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/catalog.css">
  <script src="../assets/js/account.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner container">
      <a class="brand" href="/pages/catalog.html">
        <img src="../assets/icons/logo.svg" width="64" height="64" alt="">
        <span>УниМаркет</span>
      </a>
      <button class="button button--secondary" id="logout" type="button" disabled>Выйти</button>
    </div>
  </header>
  <main class="container catalog" id="main">
    <h1>Учебные материалы</h1>
    <section class="catalog__account" aria-label="Аккаунт">
      <p>Имя на сайте: <strong id="display-name">…</strong> · Логин: <strong id="login">…</strong></p>
      <p>Баланс: <strong id="balance">…</strong> баллов · В резерве: <strong id="reserve">…</strong></p>
    </section>
    <p id="status" role="status">Загружаем данные аккаунта…</p>
    <noscript><p>Включи JavaScript для загрузки аккаунта и выхода.</p></noscript>
  </main>
</body>
</html>
